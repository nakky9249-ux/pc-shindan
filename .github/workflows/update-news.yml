name: Update PC news

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "feeds.txt"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: update-pc-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test RSS parser
        run: python -m unittest discover -s tests -v
      - name: Fetch feeds and write news.json
        run: python scripts/fetch_rss.py
      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Update PC news feed"
            git push
          fi
