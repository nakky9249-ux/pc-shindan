name: Update PC news

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "feeds.txt"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

# Use the same group across all workflow versions so only one publisher runs at a time.
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test RSS parser
        run: python -m unittest discover -s tests -v
      - name: Fetch feeds and publish safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A previous run may have updated main while this job was waiting.
          # Re-sync and re-fetch on a push race instead of failing with a stale commit.
          for attempt in 1 2 3; do
            echo "Publishing attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            python -m unittest discover -s tests -v
            python scripts/fetch_rss.py
            git add news.json

            if git diff --cached --quiet; then
              echo "News data is already current; nothing to commit."
              exit 0
            fi

            git commit -m "Update PC news feed"
            if git push origin HEAD:main; then
              echo "News update published."
              exit 0
            fi
            echo "Push raced with another update; retrying from latest main."
            sleep 2
          done

          echo "Could not publish news after three attempts."
          exit 1
