<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f19">
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <title>ページが見つかりません｜PCラボ</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0f19;--card:#161f30;--border:#23314a;--text:#f1f5f9;--muted:#94a3b8;--blue:#3b82f6;--cyan:#06b6d4}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.25rem;background:radial-gradient(circle at top,rgba(59,130,246,.15),transparent 55%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.7}
    main{width:min(100%,620px);padding:clamp(1.5rem,5vw,3rem);border:1px solid var(--border);border-radius:20px;background:rgba(22,31,48,.92);text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.25)}
    .brand{font-weight:900;letter-spacing:.04em;color:#93c5fd}
    .code{font-size:clamp(4rem,16vw,7rem);font-weight:900;line-height:1.1;margin:1rem 0;color:#60a5fa}
    h1{font-size:clamp(1.3rem,4vw,1.8rem);margin:.5rem 0}
    p{color:var(--muted);margin:0 auto 1.5rem;max-width:38rem}
    a{display:inline-block;padding:.8rem 1.15rem;border-radius:10px;background:linear-gradient(135deg,var(--blue),#8b5cf6);color:white;text-decoration:none;font-weight:700}
    a:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="brand">PCラボ</div>
    <div class="code" aria-hidden="true">404</div>
    <h1>ページが見つかりません</h1>
    <p>ページが移動・削除されたか、URLが間違っている可能性があります。トップページから目的の情報を探してみてください。</p>
    <a href="./">PCラボのトップへ戻る</a>
  </main>
</body>
</html>
